# CodeQL: static analysis for the whole tree (backend/ + frontend/).
#
# Both halves are interpreted TypeScript, so CodeQL's `build-mode: none`
# extracts them straight from source — no npm ci, no build step, and no
# autobuild guessing at the two-package layout. One analyze job covers
# backend and frontend together. The weekly cron re-runs analysis on an
# otherwise-quiet tree so newly shipped CodeQL queries still get applied.
# Findings land in the Security tab (code scanning), not as CI noise.
name: CodeQL

on:
  push:
    branches: [main]
    # Documentation-only changes skip this suite; docs/playbooks/ seeds the
    # workflow catalog and still runs it (TD-024).
    paths:
      - "**"
      - "!docs/**"
      - "docs/playbooks/**"
      - "!*.md"
  pull_request:
    # Validate stacked PRs targeting feature branches as well as main.
    # Documentation-only changes skip this suite; docs/playbooks/ seeds the
    # workflow catalog and still runs it (TD-024).
    paths:
      - "**"
      - "!docs/**"
      - "docs/playbooks/**"
      - "!*.md"
  schedule:
    # Mondays 04:30 UTC.
    - cron: "30 4 * * 1"

permissions:
  contents: read

# Cancel only PR runs that a newer push to the same PR has superseded. Pushes
# to main get their own group (keyed by sha) and scheduled runs one per run
# (keyed by run_id), so neither is ever cancelled or replaced while pending.
concurrency:
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && github.sha || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
