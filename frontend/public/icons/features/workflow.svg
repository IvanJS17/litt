<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nodeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BEBFBC" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#797C7F" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#55585F" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="nodeLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0C1BF" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#838688" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#595C62" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="nAmber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD98F" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#FFB21E" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#965900" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="nTinta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8D9093" stop-opacity="0.96"/>
      <stop offset="0.5" stop-color="#393E48" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#151A26" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#242933" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="pipe" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D5D5D1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#A1A3A3" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sheen">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- grey glass pipes -->
  <g fill="none" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round">
    <path d="M32 11 L11 32"/>
    <path d="M11 32 H53"/>
    <path d="M53 32 L32 53"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.55">
    <path d="M26.4 15.6 L15.6 26.4"/>
    <path d="M18 31.2 H46"/>
    <path d="M47.7 36.8 L36.8 47.7"/>
  </g>

  <!-- top node: purple -->
  <g>
    <circle cx="32" cy="11" r="9.1" fill="url(#nodeDark)" stroke="url(#rim)" stroke-width="1.4"/>
    <ellipse cx="30.4" cy="7.6" rx="4.7" ry="2.4" fill="url(#sheen)" opacity="0.7"/>
  </g>
  <!-- left node: blue -->
  <g>
    <circle cx="11" cy="32" r="9.1" fill="url(#nodeLight)" stroke="url(#rim)" stroke-width="1.4"/>
    <ellipse cx="9.4" cy="28.6" rx="4.7" ry="2.4" fill="url(#sheen)" opacity="0.7"/>
  </g>
  <!-- right node: ámbar -->
  <g>
    <circle cx="53" cy="32" r="9.1" fill="url(#nAmber)" stroke="url(#rim)" stroke-width="1.4"/>
    <ellipse cx="51.4" cy="28.6" rx="4.7" ry="2.4" fill="url(#sheen)" opacity="0.7"/>
  </g>
  <!-- bottom node: tinta -->
  <g>
    <circle cx="32" cy="53" r="9.1" fill="url(#nTinta)" stroke="url(#rim)" stroke-width="1.4"/>
    <ellipse cx="30.4" cy="49.6" rx="4.7" ry="2.4" fill="url(#sheen)" opacity="0.7"/>
  </g>
</svg>
