<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Tu código de verificación de LiTT</title></head>
<body style="margin:0;padding:0;background:#ECECE6;font-family:Georgia,'Times New Roman',serif;color:#151A26;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ECECE6;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:12px;">
        <tr><td style="padding:32px;">
          <p style="margin:0 0 24px;font-size:28px;font-weight:bold;letter-spacing:1px;color:#151A26;">LiTT<span style="color:#965900;">.</span></p>
          <h1 style="margin:0 0 12px;font-size:22px;font-weight:normal;color:#151A26;">Tu código de verificación de LiTT</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#151A26;">Escribe este código en LiTT para confirmar que eres tú:</p>
          <p style="margin:0 0 24px;font-family:'Courier New',monospace;font-size:28px;letter-spacing:6px;color:#151A26;">{{ .Token }}</p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#565a66;">Si no lo solicitaste, ignora este correo y no compartas el código con nadie.</p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
