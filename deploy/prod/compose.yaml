# LiTT — despliegue de producción (VPS compartido `staging-apps-dev`).
#
# Patrón de la casa: la app vive en /srv/litt con su propio proyecto compose
# (`name: litt`); NINGÚN puerto se publica al host (solo red interna); el borde
# público 80/443 lo sirve el ingress compartido (/srv/edge, edge-caddy-1) con un
# bloque `litt` en su Caddyfile; el frontend se une a la red `edge` con el alias `litt`.
#
# Almacén de documentos: Cloudflare R2, bucket `litt-docs` (externo). No hay
# object storage local. Correo del sistema: SMTP de no-reply@asteroitt.com.
# Secretos: /srv/litt/.env (600, fuera de git) — usar con --env-file en todos
# los comandos (ver README.md).
name: litt

# Rotación de logs propia de cada contenedor (10 MB × 3). Se fija aquí y no se
# hereda del daemon: un contenedor creado antes de que el host tuviera ese límite
# conserva logs sin tope hasta que se recrea.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  db:
    logging: *logging
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    mem_limit: 640m
    memswap_limit: 896m
    environment:
      POSTGRES_DB: postgres
      # pg_ctl's default wait expired while loading extensions on the shared host.
      PGCTLTIMEOUT: '300'
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      JWT_EXP: '3600'
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../../scripts/staging-db-roles.sh:/docker-entrypoint-initdb.d/zz-litt-roles.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1 -U supabase_auth_admin
        -d postgres -tAc "select 1 where to_regclass('auth.users') is not null" |
        grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 300s

  auth:
    logging: *logging
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 320m
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${PUBLIC_URL:?required}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?required}@db:5432/postgres
      GOTRUE_SITE_URL: ${PUBLIC_URL:?required}
      # Lista separada por comas. La segunda entrada es la página que cierra el
      # inicio de sesión con proveedor externo dentro de Word (README
      # §Complemento de Word); hoy no hay proveedores activos.
      GOTRUE_URI_ALLOW_LIST: ${PUBLIC_URL:?required},${WORD_ADDIN_URL:?required}/oauth-dialog.html
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?required}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Signup abierto para el arranque; cada cuenta confirma su correo.
      # Cerrar con DISABLE_SIGNUP=true (README §Decisiones).
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      # Confirmación obligatoria: compartir e invitar se basan en el correo,
      # así que nadie reclama una dirección que no recibe (TD-020).
      GOTRUE_MAILER_AUTOCONFIRM: 'false'
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: 'false'
      GOTRUE_PASSWORD_MIN_LENGTH: '10'
      # Correo del sistema: no-reply@asteroitt.com por SMTP en el puerto 587
      # (desde el 2026-11-09 el 465 de Neubox dejó de responder). GoTrue
      # v2.189.0 usa gomail.v2, que solo activa TLS implícito en el 465; en
      # cualquier otro puerto abre la conexión y, si el servidor ofrece
      # STARTTLS, la cifra con STARTTLS (README §Decisiones). Host = nombre
      # del servidor Neubox, no mail.asteroitt.com (proxy de Cloudflare, no
      # deja pasar SMTP).
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST:?required}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER:?required}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS:?required}
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL:?required}
      GOTRUE_SMTP_SENDER_NAME: ${GOTRUE_SMTP_SENDER_NAME:-LiTT}
      # Los enlaces de los correos llevan un valor derivado de un código numérico:
      # 10 dígitos es el máximo de GoTrue v2.189.0 (el default son 6). La vigencia
      # (GOTRUE_MAILER_OTP_EXP, 24 h por default) no cambia: las invitaciones se
      # abren horas después.
      GOTRUE_MAILER_OTP_LENGTH: '10'
      # Los enlaces de los correos son ${PUBLIC_URL}/auth/v1/verify; el Caddy
      # los manda a auth-edge, que solo expone esa ruta (README §5).
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      # Correos en español: las plantillas viven en frontend/public/email-templates
      # y GoTrue las pide a litt-web por la red interna (`default`, que ambos
      # comparten); el nombre es el servicio, único en esa red.
      GOTRUE_MAILER_TEMPLATES_INVITE: http://litt-web:3000/email-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://litt-web:3000/email-templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://litt-web:3000/email-templates/recovery.html
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: http://litt-web:3000/email-templates/email_change.html
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: http://litt-web:3000/email-templates/reauthentication.html
      GOTRUE_MAILER_SUBJECTS_INVITE: Te invitaron a LiTT
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirma tu correo de LiTT
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Recupera tu contraseña de LiTT
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirma el cambio de tu correo en LiTT
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: Tu código de verificación de LiTT
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:9999/health
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # Egreso solo para el SMTP saliente (puerto 587 del servidor de correo).
    # `litt-gotrue`: nombre único para auth-edge, que también está en la red
    # compartida del Caddy.
    networks:
      default:
        aliases:
        - litt-gotrue
      egress: {}

  # Borde público de GoTrue, solo para GET /auth/v1/verify con el tipo invite
  # (los enlaces de invitación; los demás correos usan /auth/confirm). Va aparte del
  # gateway para no exponer signup, token ni /rest/v1 a la red del Caddy
  # compartido.
  auth-edge:
    logging: *logging
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 64m
    environment:
      # Mismo secreto que el Caddy compartido: con él se acepta la dirección del
      # cliente para el límite por visitante (README §Dirección del cliente).
      LITT_EDGE_SECRET: ${LITT_EDGE_SECRET:?required}
    volumes:
    # Plantilla: la imagen de nginx sustituye ${LITT_EDGE_SECRET} al arrancar.
    - ./auth-edge.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8000/healthz
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    networks:
      default: {}
      edge:
        aliases:
        - litt-auth

  rest:
    logging: *logging
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    # PostgREST 14 grows slowly until its cgroup is full (upstream #5149); at
    # 128m + swap the kernel killed it about every 4 days. No swap: fail fast
    # instead of crawling, with twice the room.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?required}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?required}
    depends_on:
      db:
        condition: service_healthy

  # One-shot, on every start: an empty database gets backend/schema.sql (the
  # complete schema, with every migration it contains recorded in
  # public.schema_migrations); then backend/scripts/migrate.sh applies the
  # pending migrations, each once, under its advisory lock. Same mechanism as
  # the root docker-compose.yml. A database with a schema but no ledger stops
  # here (migrate.sh asks for a baseline) instead of being replayed blindly.
  # Application grants come from schema.sql and the migrations only.
  db-init:
    logging: *logging
    image: supabase/postgres:17.6.1.136
    restart: 'no'
    mem_limit: 256m
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?required}
      PGDATABASE: postgres
      # migrate.sh connects with DATABASE_URL; the password comes from
      # PGPASSWORD above, so it never appears in the URL.
      DATABASE_URL: postgres://postgres@db:5432/postgres
      MIGRATIONS_DIR: /migrations
    volumes:
    - ../../backend/schema.sql:/schema.sql:ro
    - ../../backend/migrations:/migrations:ro
    - ../../backend/scripts/migrate.sh:/migrate.sh:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    entrypoint:
    - bash
    - -c
    command:
    - |
      set -euo pipefail
      # A failed query stops here; it is never read as an empty database.
      existing=$$(psql -X -v ON_ERROR_STOP=1 -tAc "select to_regclass('public.user_profiles')")
      if [ -z "$$existing" ]; then
        psql -X -v ON_ERROR_STOP=1 -f /schema.sql
      fi
      bash /migrate.sh up
      psql -X -c "notify pgrst, 'reload schema'"
    healthcheck:
      disable: true

  gateway:
    logging: *logging
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 128m
    volumes:
    - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:8000/healthz
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  backend:
    logging: *logging
    # Tag = SHA completo del commit publicado del que se construyó la imagen
    # (AGPL §13: /health y el enlace "Código fuente" lo reportan; README §1).
    image: litt-backend:${LITT_SOURCE_COMMIT:?required}
    restart: unless-stopped
    # 1024m: the isolated parser runs inside this container; a Word comparison
    # (Docxodus WASM) peaks at ~360-390 MB on top of the API's ~330 MB.
    mem_limit: 1024m
    memswap_limit: 1344m
    # The API runs as an unprivileged user (litt-api) under an init that reaps
    # its children; the processes that open uploaded files run as another one
    # (litt-reader). The image starts as root only to drop to litt-api, and
    # the API needs the set-user/set-group capabilities, and only those, to
    # start the readers (README §Los lectores de archivos).
    # KILL belongs to the init (PID 1, root) alone: it lets it pass the stop
    # signal to the API, which is another user, so that `docker stop` lets the
    # API run its own shutdown. The API and the readers do not hold it and
    # cannot gain it (the API keeps only SETUID/SETGID as ambient capabilities;
    # the readers keep none, with no-new-privileges).
    init: true
    cap_drop:
    - ALL
    cap_add:
    - SETUID
    - SETGID
    - KILL
    security_opt:
    - no-new-privileges:true
    # Processes and threads of the whole container (the kernel counts both): the
    # API and its three worker threads, up to three parsers and LibreOffice
    # under each. Six files of every kind uploaded at once measured a peak under 80 on a local stack; this leaves a wide
    # margin and still stops a runaway fork (README §Los lectores de archivos). The readers also
    # have their own per-user limit (EXTRACTION_READER_PROCESS_LIMIT, 256), so a reader that forks
    # without end runs out of its own allowance and leaves this one room for the API and for the
    # process that ends a reader's group.
    pids_limit: 512
    environment:
      NODE_ENV: production
      PORT: '3001'
      FRONTEND_URL: ${PUBLIC_URL:?required}
      API_PUBLIC_URL: ${PUBLIC_URL:?required}/api
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SECRET_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?required}
      USER_API_KEYS_ENCRYPTION_SECRET: ${USER_API_KEYS_ENCRYPTION_SECRET:?required}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      # Cadena de la dirección del cliente: un solo salto de app (litt-web o
      # litt-word) delante del backend. El Caddy y una CDN no cuentan: el salto
      # reenvía exactamente una dirección (README §Dirección del cliente).
      TRUST_PROXY_HOPS: '1'
      # Beta por invitación (README §Decisiones): vacío = registro abierto.
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}
      # Silencio máximo entre salidas de un modelo (README §3, "Tiempos del
      # proveedor"). 180 s: los modelos con razonamiento alto pueden callar
      # más de 60 s entre salidas aun con el proveedor vivo.
      STREAM_CHUNK_TIMEOUT_MS: ${STREAM_CHUNK_TIMEOUT_MS:-180000}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?required}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?required}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?required}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_ANON_KEY:?required}
      # Decisión de Iván (30-oct-2026, ledger §16 "Web search and subagents
      # in chat"): subagentes encendidos, con las rutas de modelo con nombre
      # que configura cada usuario; búsqueda web encendida (owner, 2026-11-10).
      LITT_CHAT_SUBAGENTS: ${LITT_CHAT_SUBAGENTS:-enabled}
      LITT_CHAT_WEB_SEARCH: ${LITT_CHAT_WEB_SEARCH:-enabled}
      # Verificación de citas con TypeSafe (docs/citation-support-check.md):
      # apagada hasta publicar los textos legales. Además del interruptor
      # necesita la llave de la plataforma; sin ella no existe.
      LITT_CITATION_CHECK: ${LITT_CITATION_CHECK:-disabled}
      # Número diario de verificaciones por persona (en memoria; el API y el worker
      # de jobs llevan cuentas separadas). Vacío o inválido: 2000.
      LITT_CITATION_CHECK_DAILY_MAX_PER_PERSON: ${LITT_CITATION_CHECK_DAILY_MAX_PER_PERSON:-2000}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # Servidor MCP de LiTT (docs/mcp-server.md): apagado salvo que el operador lo
      # encienda. Encendido exige LITT_MCP_PUBLIC_URL (https, origen del host MCP,
      # p. ej. https://mcp.litt.asteroitt.com). El proxy y el DNS de ese host son
      # otra pieza: con la variable apagada, ninguna ruta MCP responde.
      LITT_MCP_SERVER: ${LITT_MCP_SERVER:-disabled}
      LITT_MCP_PUBLIC_URL: ${LITT_MCP_PUBLIC_URL:-}
      LITT_MCP_ALLOWED_ORIGINS: ${LITT_MCP_ALLOWED_ORIGINS:-}
      # Tope de clientes registrados a los que ninguna conexión se refiere ahora; al llegar, no se
      # crean más (docs/mcp-server.md). Vacío o inválido: 10000.
      LITT_MCP_UNAPPROVED_CLIENTS_MAX: ${LITT_MCP_UNAPPROVED_CLIENTS_MAX:-10000}
      # Complemento de Word (servicio litt-word). Con WORD_ADDIN_URL el backend
      # acepta ese origen, usa cookies particionadas para Word en la web y
      # exige AUTH_HANDOFF_ENCRYPTION_SECRET (>= 32 caracteres) al arrancar.
      WORD_ADDIN_URL: ${WORD_ADDIN_URL:?required}
      AUTH_HANDOFF_ENCRYPTION_SECRET: ${AUTH_HANDOFF_ENCRYPTION_SECRET:?required}
      # Conectores de Google (docs/google-workspace.md). Sin cliente OAuth, cada
      # conector dice que falta configurarlo. DISABLED_PROVIDERS usa "-" (no ":-"):
      # si la variable no está en .env queda el default del código (Drive apagado);
      # una lista explícita, incluso vacía, lo reemplaza.
      GOOGLE_WORKSPACE_OAUTH_CLIENT_ID: ${GOOGLE_WORKSPACE_OAUTH_CLIENT_ID:-}
      GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET: ${GOOGLE_WORKSPACE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${GOOGLE_DRIVE_OAUTH_CLIENT_ID:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_DRIVE_PICKER_API_KEY: ${GOOGLE_DRIVE_PICKER_API_KEY:-}
      GOOGLE_DRIVE_PICKER_APP_ID: ${GOOGLE_DRIVE_PICKER_APP_ID:-}
      GOOGLE_WORKSPACE_DISABLED_PROVIDERS: ${GOOGLE_WORKSPACE_DISABLED_PROVIDERS-google-drive}
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      gateway:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3001/health'').then((r) => process.exit(r.ok ? 0
        : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # Egreso externo (R2 + proveedores de IA): default es internal y no da
    # gateway; la red de egreso dedicada sí (mínima exposición).
    # `litt-backend`: nombre único para el frontend, que también está en la
    # red compartida del Caddy, donde `backend` es el de otra app.
    networks:
      default:
        aliases:
        - litt-backend
      egress: {}

  # Nombre de servicio único: Compose da a cada servicio su nombre como alias
  # en TODAS sus redes, y en la red compartida del Caddy `frontend` y `web`
  # ya pertenecen a otras apps (EscrituraLab, eKate).
  litt-web:
    logging: *logging
    image: litt-frontend:${LITT_SOURCE_COMMIT:?required}
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 512m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      API_BASE_URL: http://litt-backend:3001
      # Secreto compartido con el Caddy: solo con él se acepta la dirección del
      # cliente que reenvía (README §Dirección del cliente).
      LITT_EDGE_SECRET: ${LITT_EDGE_SECRET:?required}
      # Política de contenido de las páginas (README §Cabeceras de seguridad):
      # el origen del almacén al que el navegador sube con URL firmadas, el
      # mismo valor que firma el backend, y el interruptor que la deja solo en
      # modo de reporte (vacío = se aplica).
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?required}
      LITT_CSP_REPORT_ONLY: ${LITT_CSP_REPORT_ONLY:-}
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3000'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() =>
        process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    networks:
      default: {}
      edge:
        aliases:
        - litt

  # Complemento de Word: sirve el panel y manifest.xml, y reenvía /api/* al
  # backend en el mismo origen (cookies de sesión de primera parte en Word).
  # Mismo cuidado de nombres que litt-web: `litt-word` es único en `edge`.
  litt-word:
    logging: *logging
    image: litt-word:${LITT_SOURCE_COMMIT:?required}
    restart: unless-stopped
    # Servidor de archivos estáticos + proxy; menos que litt-web (Next).
    mem_limit: 192m
    memswap_limit: 320m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WORD_ADDIN_BACKEND_ORIGIN: http://litt-backend:3001
      # Mismo secreto que litt-web y el Caddy (README §Dirección del cliente).
      LITT_EDGE_SECRET: ${LITT_EDGE_SECRET:?required}
      # Igual que litt-web: origen del almacén y modo de reporte de la política.
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?required}
      LITT_CSP_REPORT_ONLY: ${LITT_CSP_REPORT_ONLY:-}
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - 'fetch(''http://127.0.0.1:3200/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() =>
        process.exit(1))'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    networks:
      default: {}
      edge:
        aliases:
        - litt-word

volumes:
  db_data:

networks:
  default:
    internal: true
  # Egreso externo: backend (R2 + proveedores de IA) y auth (SMTP).
  egress:
  # Red del ingress compartido (/srv/edge, contenedor edge-caddy-1; HOST-RULES §1).
  # Solo `litt-web` (alias `litt`), `auth-edge` (alias `litt-auth`) y
  # `litt-word` (alias `litt-word`) entran: son los nombres que resuelve el
  # bloque litt del Caddyfile. El resto del
  # stack queda aislado en la red interna.
  edge:
    external: true
    name: edge
