# Fachada interna de Supabase (gotrue + postgrest) para el backend de LiTT.
#
# En producción el borde público es el Caddy compartido; este servicio NO
# publica puertos al host y solo existe en la red interna del compose.
# (En el fixture de staging este mismo rol lo cumple docker/staging/proxy.conf,
# que además relaya el PUT firmado del contrato upload-sessions hacia MinIO;
# en producción el navegador sube directo a Cloudflare R2 y ese relay no aplica.)
server {
    listen 8000;
    server_name _;
    client_max_body_size 50m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    # Fachada solo interna: el backend la sondea varias veces por segundo
    # (colas de trabajos), y registrar cada petición llenaba el disco del host
    # (~270 MB/día sin uso). Los errores siguen en el error_log de nginx.
    access_log off;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /auth/v1/ {
        set $auth auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_pass http://$auth;
    }
    location /rest/v1/ {
        set $rest rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_pass http://$rest;
    }
}
