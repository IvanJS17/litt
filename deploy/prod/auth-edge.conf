# Borde público de GoTrue para LiTT: SOLO los enlaces de los correos.
#
# El Caddy compartido manda https://<dominio>/auth/v1/verify aquí (alias
# `litt-auth` en su red). Cualquier otra ruta responde 404: signup, token,
# admin y PostgREST siguen solo en la red interna (gateway.conf).
server {
    listen 8000;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /auth/v1/verify {
        limit_except GET { deny all; }
        set $auth litt-gotrue:9999;  # alias único (la red del Caddy es compartida)
        rewrite ^ /verify break;
        proxy_set_header Host $http_host;
        proxy_pass http://$auth;
    }
    location / { return 404; }
}
