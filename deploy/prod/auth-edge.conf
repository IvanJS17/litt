# Borde público de GoTrue para LiTT: SOLO los enlaces de invitación.
#
# El Caddy compartido manda https://<dominio>/auth/v1/verify aquí (alias
# `litt-auth` en su red). Cualquier otra ruta responde 404: signup, token,
# admin y PostgREST siguen solo en la red interna (gateway.conf).
#
# Este archivo es una plantilla: la imagen de nginx sustituye ${LITT_EDGE_SECRET}
# al arrancar (compose lo monta en /etc/nginx/templates/). Es el mismo secreto
# que el Caddy manda en X-Litt-Edge (README §Dirección del cliente).
#
# Sobre /auth/v1/verify:
#  - Solo pasa el enlace de invitación, con la forma exacta que genera GoTrue:
#    token=<valor>&type=invite[&redirect_to=<url>]. Cualquier otra consulta
#    (otro tipo, parámetros repetidos, mayúsculas, escapes en los nombres o en
#    type, ';', parámetros de más, otro orden) responde 404 sin llegar a GoTrue.
#    La confirmación, la recuperación y el cambio de correo no usan esta ruta:
#    sus correos apuntan a /auth/confirm.
#  - Límite por dirección de cliente. La clave es la dirección que manda el
#    Caddy en X-Forwarded-For solo si X-Litt-Edge trae el secreto; en cualquier
#    otro caso es la dirección TCP de quien llama. Con la variable vacía nadie
#    es de confianza; sin la variable definida nginx no arranca.
#  - A GoTrue nunca llega X-Litt-Edge, y su X-Forwarded-For es la clave.
limit_req_zone $litt_client zone=litt_verify:10m rate=10r/m;
limit_req_status 429;

server {
    listen 8000;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Dirección del cliente. Se confía en X-Forwarded-For solo con el secreto
    # exacto (se distinguen mayúsculas) y el encabezado con valor: "m" = el
    # secreto coincide, "p" = el encabezado trae valor; así un secreto vacío no
    # da confianza a quien no manda el encabezado.
    set $litt_client $remote_addr;
    set $litt_trust "";
    if ($http_x_litt_edge = "${LITT_EDGE_SECRET}") { set $litt_trust "m"; }
    if ($http_x_litt_edge != "") { set $litt_trust "${litt_trust}p"; }
    if ($litt_trust = "mp") { set $litt_client $http_x_forwarded_for; }
    if ($litt_client = "") { set $litt_client $remote_addr; }

    # Consulta exacta del enlace de invitación, sobre el texto crudo (sin
    # decodificar): lo que GoTrue decodificaría o leería de otra forma no
    # coincide y se rechaza.
    set $litt_query_ok 0;
    if ($args ~ "^token=[A-Za-z0-9_-]{1,128}&type=invite(&redirect_to=[^&;#]*)?$") { set $litt_query_ok 1; }

    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location = /auth/v1/verify {
        limit_except GET { deny all; }
        if ($litt_query_ok = 0) { return 404; }
        # 10 por minuto sostenido y hasta 10 de golpe (README §Límite).
        limit_req zone=litt_verify burst=10 nodelay;
        set $auth litt-gotrue:9999;  # alias único (la red del Caddy es compartida)
        rewrite ^ /verify break;
        proxy_set_header Host $http_host;
        proxy_set_header X-Litt-Edge "";
        proxy_set_header X-Forwarded-For $litt_client;
        proxy_pass http://$auth;
    }
    location / { return 404; }
}
